services:
  # ----------------- INFRASTRUCTURE -----------------
  postgres:
    image: postgres:16-alpine
    container_name: cvpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resultmatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-resultmatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cvpilot-network

  redis:
    image: redis:7-alpine
    container_name: cvpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cvpilot-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: cvpilot-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - cvpilot-network

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: cvpilot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - cvpilot-network

  # ----------------- BACKEND SERVICES -----------------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: cvpilot-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BOT_AGENT_URI: http://bot-agent:8081
      AI_AGENTS_URI: http://ai-agents:8000
      AI_EMBEDDINGS_URI: http://ai-embeddings:8001
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_key_at_least_32_chars_long}
    depends_on:
      - bot-agent
      - ai-agents
      - ai-embeddings
    networks:
      - cvpilot-network

  bot-agent:
    build:
      context: .
      dockerfile: bot-agent/Dockerfile
    container_name: cvpilot-bot-agent
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-resultmatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_key_at_least_32_chars_long}
      AI_AGENTS_URL: http://ai-agents:8000
      AI_EMBEDDINGS_URL: http://ai-embeddings:8001
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-resultmatch-resumes}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - cvpilot-network

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: cvpilot-worker
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-resultmatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_AGENTS_URL: http://ai-agents:8000
      AI_EMBEDDINGS_URL: http://ai-embeddings:8001
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-resultmatch-resumes}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - cvpilot-network

  # ----------------- AI SERVICES (PYTHON) -----------------
  ai-agents:
    build:
      context: ./ai-agents
      dockerfile: Dockerfile
    container_name: cvpilot-ai-agents
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-resultmatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - cvpilot-network

  ai-embeddings:
    build:
      context: ./ai-embeddings
      dockerfile: Dockerfile
    container_name: cvpilot-ai-embeddings
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - cvpilot-network

  # ----------------- FRONTEND -----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cvpilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_WS_URL: ws://localhost/ws
    networks:
      - cvpilot-network

  # ----------------- REVERSE PROXY -----------------
  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: cvpilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - gateway
      - bot-agent
    networks:
      - cvpilot-network

  # ----------------- MONITORING -----------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cvpilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cvpilot-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cvpilot-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cvpilot-network

networks:
  cvpilot-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
