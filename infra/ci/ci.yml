name: CVPilot CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-java:
    name: Build & Test Java Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml -DskipTests

  lint-python:
    name: Lint & Test Python Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (ai-agents)
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-agents/requirements.txt

      - name: Install dependencies (ai-embeddings)
        run: |
          pip install -r ai-embeddings/requirements.txt
