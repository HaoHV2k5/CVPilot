global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "bot-agent"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["bot-agent:8081"]

  - job_name: "worker"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["worker:8082"]
