server:
  port: 8081

spring:
  application:
    name: bot-agent
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:resultmatch}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: bot-agent-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  jwt:
    secret: ${JWT_SECRET:very_secret_default_jwt_key_that_is_at_least_32_bytes_long}
    expiration-ms: 86400000
  services:
    ai-agents-url: ${AI_AGENTS_URL:http://localhost:8000}
    ai-embeddings-url: ${AI_EMBEDDINGS_URL:http://localhost:8001}
  r2:
    endpoint: ${R2_ENDPOINT:https://example.r2.cloudflarestorage.com}
    access-key-id: ${R2_ACCESS_KEY_ID:dummy-key}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:dummy-secret}
    bucket: ${R2_BUCKET:resultmatch-resumes}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
