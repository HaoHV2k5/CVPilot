server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: bot-agent-route
          uri: ${BOT_AGENT_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/cv/**, /api/v1/roadmap/**, /api/v1/jobs/**, /ws/**
        - id: ai-agents-route
          uri: ${AI_AGENTS_URI:http://localhost:8000}
          predicates:
            - Path=/api/v1/ai/chat/**, /api/v1/ai/market/**
        - id: ai-embeddings-route
          uri: ${AI_EMBEDDINGS_URI:http://localhost:8001}
          predicates:
            - Path=/api/v1/embeddings/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
